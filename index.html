<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pastezone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="https://beckettclarke.ca/css/fontawesome.css" />
  <link rel="stylesheet" href="https://beckettclarke.github.io/resources/fonts/satoshi/import.css">
  <link rel="stylesheet" href="./style.css">
  <link href="img/light.ico" rel="icon" media="(prefers-color-scheme: dark)" />
  <link href="img/dark.ico" rel="icon" media="(prefers-color-scheme: light)" />
  <link rel="apple-touch-icon" href="img/app.png">
  <script defer src="./script.js"></script>
</head>
<body class="plain" data-anim="glow">
  <!-- Credit: Zac Ong on Unsplash -->
  <img src="img/bglowres.jpeg" id="background" alt="">
  <div id="scrim"></div>

  <header id="bar">
    <div id="brand">
      <i class="fas fa-clipboard"></i> Pastezone <span class="half">4</span>
      <span id="stats"></span>
    </div>
    <nav id="btns">
      <button id="copy-btn" title="Copy all" onclick="copyZText()"><i class="far fa-clone"></i><span>Copy</span></button>
      <button id="clear-btn" title="Clear" onclick="clearZone()"><i class="far fa-trash"></i><span>Clear</span></button>
      <button id="export-btn" title="Download as a file" onclick="exportTXT()"><i class="far fa-arrow-down-to-line"></i><span>Export</span></button>
    </nav>
  </header>

  <main id="stage">
    <div id="editor">
      <div id="sheet">
        <div id="mirror" aria-hidden="true"></div>
        <textarea id="zone" placeholder="Paste or write anything..." spellcheck="false"></textarea>
      </div>
    </div>
  </main>

  <div id="toasts" aria-live="polite"></div>
</body>
</html>
